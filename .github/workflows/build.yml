name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q soul_blocks.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build
        working-directory: soul_blocks
      - uses: actions/upload-artifact@v4
        with:
          name: soul_blocks_jar
          path: soul_blocks/build/libs/*.jar
